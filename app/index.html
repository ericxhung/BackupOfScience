<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科展實驗數據儀表板</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- 標題 -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-blue-600">📊 幾丁聚醣水污染修復 - 實驗數據儀表板</h1>
            <p class="text-gray-500 mt-2">雲端即時檢視、趨勢圖表與數據篩選系統</p>
        </header>

        <!-- 統計與控制區 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">📁 資料狀態</h3>
                <p class="text-gray-600">已載入實驗日期數量：<span class="font-bold text-blue-600">{{ dates|length }}</span> 天</p>
                <p class="text-gray-600">實驗項目總數：<span class="font-bold text-green-600">{{ items|length }}</span> 個</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 md:col-span-2">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">🔍 快速篩選</h3>
                <div class="flex flex-wrap gap-4">
                    <div>
                        <label class="block text-sm text-gray-500 mb-1">選擇檢視特定日期：</label>
                        <select id="dateSelect"
                            class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                            <option value="all">全部顯示</option>
                            {% for d in dates %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- 📈 圖表區 -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 mb-8">
            <h3 class="text-xl font-bold text-gray-700 mb-4">📈 實驗數據趨勢折線圖</h3>
            <div class="relative h-96">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <!-- 📋 完整數據矩陣表格 -->
        <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 overflow-x-auto">
            <h3 class="text-xl font-bold text-gray-700 mb-4">📋 完整實驗數據對照表</h3>
            <div class="overflow-x-auto">
                {{ tables | safe }}
            </div>
        </div>
    </div>

    <!-- 圖表渲染 script -->
    <script>
        const rawChartData = {{ chart_data | tojson | safe }};

        const ctx = document.getElementById('myChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'line',
            data: rawChartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: { color: '#f3f4f6' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
    </script>
</body>

</html>
