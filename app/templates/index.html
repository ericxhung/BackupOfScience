{% extends "base.html" %}
{% block title %}首頁 - 科展實驗數據儀表板{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- 歡迎與狀態總覽卡片 -->
    <div class="bg-white p-6 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl font-bold text-blue-600">📊 幾丁聚醣水污染修復 - 實驗數據儀表板</h1>
            <p class="text-gray-500 mt-1">歡迎回來！首頁已為您即時載入所有項目的綜合實驗趨勢。</p>
        </div>
        <div class="flex gap-3 shrink-0">
            <a href="/chart"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 shadow transition">📊
                進階圖表繪製</a>
            <a href="/files"
                class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-300 transition">📁
                瀏覽專案檔案</a>
        </div>
    </div>

    <!-- 📈 綜合總覽折線圖 -->
    <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-lg font-bold text-gray-700 mb-4">📈 實驗數據總覽折線圖</h2>
        <div class="relative h-[500px]">
            <canvas id="summaryChart"></canvas>
        </div>
    </div>
</div>

<script>
    const summaryData = {{ summary_chart | tojson | safe }};

    const ctx = document.getElementById('summaryChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: summaryData,
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    title: { display: true, text: '日期' },
                    grid: { display: false }
                },
                y: {
                    title: { display: true, text: '數值' },
                    grid: { color: '#f3f4f6' }
                }
            }
        }
    });
</script>
{% endblock %}
