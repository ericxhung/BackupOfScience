<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}科展實驗數據儀表板{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Prism.js 語法高亮 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }

            .print-only-chart {
                width: 100% !important;
                height: 100vh !important;
            }
        }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">
    <!-- 導覽列 -->
    <nav class="bg-blue-600 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold flex items-center gap-2">
                ⚡ 科展數據儀表板
            </a>
            <div class="flex space-x-4 font-medium text-sm">
                <a href="/" class="hover:bg-blue-700 px-3 py-2 rounded">🏠 首頁</a>
                <a href="/chart" class="hover:bg-blue-700 px-3 py-2 rounded">📊 圖表繪製</a>
                <a href="/files" class="hover:bg-blue-700 px-3 py-2 rounded">📁 檔案查看</a>
                <a href="/download" class="hover:bg-blue-700 px-3 py-2 rounded">📥 資源下載</a>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500 no-print">
        幾丁聚醣修復水污染研究 - 實驗數據與分析系統
    </footer>
</body>

</html>
