{% extends "base.html" %}
{% block title %}資源下載 - 科展儀表板{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <h2 class="text-2xl font-bold text-gray-800 border-b pb-3">📥 本機工具資源下載</h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {% for res in resources %}
        <div class="bg-white p-6 rounded-xl shadow-md border flex flex-col justify-between">
            <div>
                <h3 class="text-lg font-bold text-blue-600 mb-2">📄 {{ res.name }}</h3>
                <p class="text-sm text-gray-600 mb-4">{{ res.desc }}</p>
            </div>
            <a href="/raw_file?path={{ res.path }}" download
                class="w-full text-center py-2 bg-green-600 text-white rounded font-medium text-sm hover:bg-green-700">
                📥 下載指令碼
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
